<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk – UMKMart</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#b5000b', 'primary-container': '#e30613',
            secondary: '#5e5e5e', surface: '#f8f9fb',
            'surface-variant': '#e1e2e4', 'surface-container-low': '#f3f4f6',
            'surface-container': '#edeef0', 'surface-container-high': '#e7e8ea',
            'surface-container-highest': '#e1e2e4', 'card-bg': '#ffffff',
            outline: '#936e69', 'outline-variant': '#e9bcb6',
            success: '#10b981', error: '#ba1a1a',
            charcoal: '#1a1a2e', muted: '#6b7280',
          },
          fontFamily: { display: ['Playfair Display', 'serif'] },
        },
      },
    };
  </script>
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .font-display { font-family: 'Playfair Display', serif; }
    .ti { font-size: 24px; display: inline-block; vertical-align: middle; }
    .bg-brand { background: linear-gradient(135deg, #b5000b 0%, #e30613 100%); }
    .form-card { animation: fadeUp .5s ease forwards; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .input-field { transition: all .2s; }
    .input-field:focus { border-color: #b5000b; box-shadow: 0 0 0 3px rgba(181,0,11,.1); }
    .social-btn { transition: all .2s; }
    .social-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); }
  </style>
</head>
<body class="bg-[#f8f9fb] min-h-screen flex">
  <div class="hidden lg:flex lg:w-1/2 bg-brand flex-col items-center justify-center p-12 relative overflow-hidden">
    <div class="absolute inset-0 opacity-10">
      <div class="absolute top-10 left-10 w-40 h-40 border-4 border-white rounded-full"></div>
      <div class="absolute bottom-20 right-10 w-56 h-56 border-4 border-white rounded-full"></div>
    </div>
    <div class="relative z-10 text-white text-center">
      <div class="mb-8"><i class="ti ti-building-store" style="font-size:72px"></i></div>
      <h2 class="font-display text-4xl font-bold mb-4">Selamat Datang<br/>di UMKMart</h2>
      <p class="text-lg opacity-80 max-w-xs leading-relaxed">Masuk ke akun Anda untuk kelola toko dan produk UMKM.</p>
      <div class="mt-10 flex items-center gap-8 justify-center">
        <div class="text-center"><p class="text-3xl font-bold">500+</p><p class="text-sm opacity-70">Produk</p></div>
        <div class="w-px h-12 bg-white/30"></div>
        <div class="text-center"><p class="text-3xl font-bold">120+</p><p class="text-sm opacity-70">UMKM</p></div>
        <div class="w-px h-12 bg-white/30"></div>
        <div class="text-center"><p class="text-3xl font-bold">5</p><p class="text-sm opacity-70">Kota</p></div>
      </div>
    </div>
  </div>

  <div class="w-full lg:w-1/2 flex items-center justify-center p-6 lg:p-12">
    <div class="w-full max-w-md form-card">
      <a href="index.html" class="inline-flex items-center gap-2 text-muted hover:text-primary text-sm font-medium mb-8 transition-colors">
        <i class="ti ti-arrow-left" style="font-size:18px"></i>
        Kembali ke Beranda
      </a>
      <div class="mb-8">
        <a href="index.html" class="font-display text-3xl font-bold text-primary block mb-2">UMKMart</a>
        <h1 class="text-2xl font-bold text-charcoal">Masuk ke akun Anda</h1>
        <p class="text-muted text-sm mt-1">Belum punya akun? <a href="register.html" class="text-primary font-semibold hover:underline">Daftar gratis</a></p>
      </div>

      <!-- Social -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <button class="social-btn flex items-center justify-center gap-2 border border-gray-200 rounded-xl py-3 text-sm font-medium hover:border-gray-300 bg-white">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button class="social-btn flex items-center justify-center gap-2 border border-gray-200 rounded-xl py-3 text-sm font-medium hover:border-gray-300 bg-white">
          <svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>

      <div class="flex items-center gap-4 mb-6">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-muted text-xs font-medium">ATAU MASUK DENGAN EMAIL</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-charcoal mb-1.5">Email</label>
          <div class="relative">
            <i class="ti ti-mail absolute left-3.5 top-1/2 -translate-y-1/2 text-muted" style="font-size:18px"></i>
            <input type="email" class="input-field w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl text-sm bg-white outline-none" placeholder="email@anda.com" required />
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold text-charcoal mb-1.5">Kata Sandi</label>
          <div class="relative">
            <i class="ti ti-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-muted" style="font-size:18px"></i>
            <input type="password" id="pwd" class="input-field w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl text-sm bg-white outline-none" placeholder="••••••••" required />
            <button type="button" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-muted hover:text-charcoal" onclick="togglePwd()">
              <i class="ti ti-eye" id="pwd-icon" style="font-size:18px"></i>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="rounded border-gray-300 text-primary" />
            <span class="text-sm text-muted">Ingat saya</span>
          </label>
          <a href="#" class="text-sm text-primary font-semibold hover:underline">Lupa password?</a>
        </div>
        <button type="submit" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-base hover:brightness-90 transition-all active:scale-[.98] shadow-lg shadow-primary/25 mt-2">
          Masuk
        </button>
        <div class="text-center">
          <p class="text-sm text-muted">Ingin jualan? <a href="register.html" class="text-primary font-semibold hover:underline">Daftar sebagai UMKM</a></p>
        </div>
      </form>
    </div>
  </div>

  <script>
    function togglePwd() {
      const i = document.getElementById('pwd');
      const ic = document.getElementById('pwd-icon');
      if (i.type === 'password') { i.type = 'text'; ic.textContent = 'visibility_off'; }
      else { i.type = 'password'; ic.textContent = 'visibility'; }
    }
    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      btn.textContent = 'Memproses...';
      btn.disabled = true;
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }
  </script>
</body>
</html>
